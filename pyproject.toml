[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arx-x5-control"
version = "0.3.0"
description = "PC Python port of the ARX X5 H7 arm control core; transport independent"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
arx-x5-control = "arx_x5_control.__main__:main"
arx-x5-sdk-demo = "arx_x5_control.sdk_demo:main"

[tool.setuptools]
# 显式列出 SDK 包，未初始化子模块时让构建报错，避免生成缺少 SDK 的安装包。
packages = ["arx_x5_control", "libs.gravity_compensation", "sdk", "sdk.tui"]

[tool.setuptools.package-data]
"libs.gravity_compensation" = ["models/*.urdf", "models/LICENSE", "LICENSE", "PROVENANCE.md"]
"sdk" = ["README.md", "API.md", "config/README.md"]
