[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arx-x5-control"
version = "0.1.0"
description = "PC Python port of the ARX X5 H7 arm control core; transport independent"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
arx-x5-control = "arx_x5_control.__main__:main"

[tool.setuptools.packages.find]
include = ["arx_x5_control*", "libs.gravity_compensation"]

[tool.setuptools.package-data]
"libs.gravity_compensation" = ["models/*.urdf", "models/LICENSE", "LICENSE", "PROVENANCE.md"]
